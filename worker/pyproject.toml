[project]
name = "estimation-worker"
version = "0.1.0"
description = "Python extraction worker for the steel estimation platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "pymupdf>=1.24",
    "numpy>=2.0",
    # image-based Find similar (Phase 14d, src/build/col_image.py): template matching
    "opencv-python-headless>=5.0,<6",
]

[project.optional-dependencies]
# Optional local OCR cross-check (docs/OCR_DEPENDENCY_REVIEW.md). Off by default; install with
# `make setup-ocr`. Never needed for decoding.
ocr = [
    "rapidocr-onnxruntime>=1.4,<1.5",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    # overlay pictures of the measurement harnesses (measure/p12c_eval.py, p14b, p14d)
    "pillow>=12.3,<13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
