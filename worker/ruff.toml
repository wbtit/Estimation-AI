line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "B"]
ignore = []

# Research code of the Phase 4e study: scripts add their own folder to sys.path (they run isolated)
[lint.per-file-ignores]
"tools/study/*.py" = ["E402", "I001", "E501", "E741", "B905", "B007"]
"tests/test_study_tools.py" = ["E402", "I001", "E501", "B905"]
# Phase 5t takeoff intake study tools (research code, same treatment as the Phase 4e study tools)
"tools/takeoff/*.py" = ["E402", "I001", "E501", "E741", "B905", "B007"]
"tests/test_takeoff_tools.py" = ["E402", "I001", "E501", "B905"]
