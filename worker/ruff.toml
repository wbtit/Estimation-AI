line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "B"]
ignore = []

# Research code moved from the Phase 5t takeoff study tools (the measurement core and the
# intake tools keep the treatment they had)
[lint.per-file-ignores]
"tools/takeoff/*.py" = ["E402", "I001", "E501", "E741", "B905", "B007"]
"measure/takeoff/*.py" = ["E402", "I001", "E501", "E741", "B905", "B007"]
