# gitleaks config: the default ruleset plus a rule for passwords inside connection URLs,
# which the default rules do not catch. Only the change_me placeholder is allowed.
title = "estimation-ai gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "connection-url-password"
description = "Password embedded in a database or broker connection URL"
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|rediss?|amqps?)://[^:/\s@'"]+:([^@\s/'"]+)@'''
secretGroup = 1

[rules.allowlist]
regexes = ['''^change_me$''']
